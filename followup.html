<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0d3d39"/>
  <title>Grupo Trend — Follow-Up</title>
  <script>if(!sessionStorage.getItem('gt_user'))window.location.href='login.html';</script>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Grupo Trend"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    :root{
      --bg:#eef1f2;--bg2:#fff;--bg3:#f4f6f7;--bg4:#e8eced;
      --border:#e2e7e8;--border2:#d2d9da;
      --text:#15302d;--text2:#5a6e6b;--text3:#9aabaa;
      --primary:#0d4f4a;--primary-dim:#e0efed;--primary-mid:#b8dcd8;
      --green:#1faa6a;--green-dim:#e2f5ec;
      --red:#e0563f;--red-dim:#fde8e3;
      --amber:#e8a020;--amber-dim:#fcf0d8;
      --purple:#6b6fc4;--purple-dim:#ebecf8;
      --wpp:#1faa6a;
      --shadow:0 1px 3px rgba(20,60,55,.06),0 4px 16px rgba(20,60,55,.04);
    }
    body.dark{
      --bg:#0a1413;--bg2:#0f1f1d;--bg3:#16302d;--bg4:#1e3d39;
      --border:#1c3835;--border2:#2a4d48;
      --text:#eaf3f1;--text2:#8ba8a3;--text3:#5a7873;
      --primary:#2dd4bf;--primary-dim:#0f2e2a;--primary-mid:#1a4d46;
      --green:#34d888;--green-dim:#0d2a1e;
      --red:#f06a52;--red-dim:#2e1512;
      --amber:#f0b040;--amber-dim:#2e2410;
      --purple:#8b8fe0;--purple-dim:#1a1a30;
      --shadow:0 2px 12px rgba(0,0,0,.4);
    }

    body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;color:var(--text);min-height:100vh;transition:background .25s}

    /* TOPBAR */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:62px;background:var(--primary);position:sticky;top:0;z-index:100}
    .topbar-left{display:flex;align-items:center;gap:12px}
    .logo-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
    .logo-icon svg{width:20px;height:20px;fill:#fff}
    .logo-name{font-size:16px;font-weight:700;color:#fff}
    .logo-sub{font-size:11px;color:rgba(255,255,255,.7)}
    .topbar-right{display:flex;align-items:center;gap:10px}
    .user-label{font-size:12px;color:rgba(255,255,255,.85)}
    .btn-modo{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:13px;cursor:pointer;font-weight:500;transition:background .15s}
    .btn-modo:hover{background:rgba(255,255,255,.22)}
    .btn-back{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:13px;cursor:pointer;text-decoration:none;font-weight:500;transition:background .15s}
    .btn-back:hover{background:rgba(255,255,255,.2)}

    /* CONTENT */
    .content{max-width:1000px;margin:0 auto;padding:20px 24px 40px}

    /* HEADER SECTION */
    .page-header{margin-bottom:20px}
    .page-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.4px}
    .page-sub{font-size:13px;color:var(--text3);margin-top:3px}

    /* FILTROS BÁSICOS */
    .filters-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
    .fg{display:flex;flex-direction:column;gap:5px}
    .flabel{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
    .filters-row select,.filters-row input[type=date]{height:42px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:13px;padding:0 12px;outline:none;min-width:150px;-webkit-appearance:none;transition:border .2s;box-shadow:var(--shadow)}
    .filters-row select:focus,.filters-row input:focus{border-color:var(--primary)}

    /* BALÕES DE MOTIVO */
    .motivo-balls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    .ball{
      display:flex;align-items:center;gap:10px;
      padding:12px 18px;border-radius:14px;
      background:var(--bg2);border:2px solid var(--border);
      cursor:pointer;transition:all .18s;box-shadow:var(--shadow);
      min-width:130px;
    }
    .ball:hover{transform:translateY(-2px)}
    .ball.active{border-color:var(--primary);background:var(--primary-dim)}
    .ball-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .ball-icon svg{width:19px;height:19px}
    .ball-info{flex:1}
    .ball-count{font-size:22px;font-weight:700;line-height:1;color:var(--text)}
    .ball-label{font-size:11px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
    /* Cores por tipo */
    .ball-todos .ball-icon{background:var(--primary-dim);color:var(--primary)}
    .ball-outros .ball-icon{background:var(--purple-dim);color:var(--purple)}
    .ball-preco .ball-icon{background:var(--amber-dim);color:var(--amber)}
    .ball-naotem .ball-icon{background:var(--red-dim);color:var(--red)}
    .ball-numero .ball-icon{background:var(--green-dim);color:var(--green)}

    /* CARDS GRID */
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .15s}
    .card:hover{transform:translateY(-2px)}
    .card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .card-nome{font-size:15px;font-weight:700;color:var(--text)}
    .card-meta{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.4}
    .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
    .pill-sl{background:var(--green-dim);color:var(--green)}
    .pill-hv{background:var(--red-dim);color:var(--red)}
    .motivo-tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:600;margin-top:5px}
    .mt-outros{background:var(--purple-dim);color:var(--purple)}
    .mt-preco{background:var(--amber-dim);color:var(--amber)}
    .mt-naotem{background:var(--red-dim);color:var(--red)}
    .mt-numero{background:var(--green-dim);color:var(--green)}
    .card-detalhe{font-size:13px;color:var(--text2);line-height:1.5;background:var(--bg3);border-radius:10px;padding:12px 14px;border-left:3px solid var(--border2)}
    .card-ia{font-size:13px;color:var(--text);line-height:1.6;background:var(--primary-dim);border-radius:10px;padding:12px 14px;border-left:3px solid var(--primary);display:none}
    .card-ia.show{display:block}
    .ia-label{font-size:10px;color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
    .card-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
    .btn-ia{flex:1;min-width:120px;height:38px;background:var(--primary-dim);color:var(--primary);border:1px solid var(--primary-mid);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
    .btn-ia:hover{background:var(--primary);color:#fff}
    .btn-ia:disabled{opacity:.5;cursor:not-allowed}
    .btn-wpp{flex:1;min-width:120px;height:38px;background:var(--wpp);color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s;text-decoration:none}
    .btn-wpp:hover{filter:brightness(1.08)}
    .btn-wpp.disabled{background:var(--bg4);color:var(--text3);pointer-events:none}
    .spinner-sm{width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .empty{text-align:center;padding:70px 20px;color:var(--text3);grid-column:1/-1}
    .empty svg{width:52px;height:52px;margin-bottom:14px;opacity:.4}
    .loading-wrap{text-align:center;padding:70px;color:var(--text3);font-size:14px}

    @media(max-width:600px){
      .topbar{padding:0 16px}
      .content{padding:16px 16px 40px}
      .cards-grid{grid-template-columns:1fr}
      .ball{min-width:calc(50% - 5px);flex:1}
      .user-label{display:none}
      .btn-back span{display:none}
      .btn-back{padding:0 12px}
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></div>
    <div>
      <div class="logo-name">Follow-Up</div>
      <div class="logo-sub">Clientes para recontatar</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="user-label" id="userLabel"></span>
    <button class="btn-modo" id="btnModoVendedor" onclick="ativarModoVendedor()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <span>Modo vendedor</span>
    </button>
    <button class="btn-back" id="btnDashboard" onclick="voltarDashboard()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Dashboard</span>
    </button>
  </div>
</div>

<div class="content">
  <div class="page-header">
    <div class="page-title">Acompanhamento de clientes</div>
    <div class="page-sub">Clientes que não compraram — gere mensagens personalizadas e recontate via WhatsApp</div>
  </div>

  <!-- Filtros de data e loja -->
  <div class="filters-row">
    <div class="fg"><span class="flabel">Data início</span><input type="date" id="fDI" onchange="aplicarFiltros()"/></div>
    <div class="fg"><span class="flabel">Data fim</span><input type="date" id="fDF" onchange="aplicarFiltros()"/></div>
    <div class="fg" id="fLojaWrap"><span class="flabel">Loja</span>
      <select id="fLoja" onchange="aplicarFiltros()">
        <option value="">Todas as lojas</option>
        <option>Santa Lolla Formosa</option>
        <option>Santa Lolla Cristalina</option>
        <option>Havaianas Formosa</option>
        <option>Havaianas Sobradinho</option>
        <option>Havaianas Paranoá</option>
        <option>Havaianas Unaí</option>
        <option>Havaianas Paracatu</option>
      <option>Havaianas Luziânia</option>
      <option>Havaianas Novo Gama</option>
      <option>Havaianas Caldas Novas</option>
      <option>Havaianas Itumbiara</option>
      <option>Havaianas Araxá</option>
      <option>Havaianas Grande Colorado</option>
      </select>
    </div>
  </div>

  <!-- Balões de motivo -->
  <div class="motivo-balls" id="motivoBalls">
    <div class="ball ball-todos active" data-motivo="" onclick="selecionarMotivo(this,'')">
      <div class="ball-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z" opacity="0"/><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg></div>
      <div class="ball-info"><div class="ball-count" id="cnt-todos">0</div><div class="ball-label">Todos</div></div>
    </div>
    <div class="ball ball-outros" data-motivo="OUTROS" onclick="selecionarMotivo(this,'OUTROS')">
      <div class="ball-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></div>
      <div class="ball-info"><div class="ball-count" id="cnt-outros">0</div><div class="ball-label">Outros</div></div>
    </div>
    <div class="ball ball-preco" data-motivo="PREÇO" onclick="selecionarMotivo(this,'PREÇO')">
      <div class="ball-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div>
      <div class="ball-info"><div class="ball-count" id="cnt-preco">0</div><div class="ball-label">Preço</div></div>
    </div>
    <div class="ball ball-naotem" data-motivo="NÃO TEM" onclick="selecionarMotivo(this,'NÃO TEM')">
      <div class="ball-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>
      <div class="ball-info"><div class="ball-count" id="cnt-naotem">0</div><div class="ball-label">Não tem</div></div>
    </div>
    <div class="ball ball-numero" data-motivo="NÚMERO" onclick="selecionarMotivo(this,'NÚMERO')">
      <div class="ball-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"/><path d="M9 7V4h6v3M9 20h6M12 4v16"/></svg></div>
      <div class="ball-info"><div class="ball-count" id="cnt-numero">0</div><div class="ball-label">Número</div></div>
    </div>
  </div>

  <div id="cardsWrap" class="loading-wrap">Carregando dados...</div>
</div>

<script>
const API_URL  = 'https://script.google.com/macros/s/AKfycbwjmJzYCZwya96993SBIprhJ0K53ryxP2F_DAg5QwrrvySHQhhmdENus-mateE71Z0gBw/exec';
const GT_USER  = sessionStorage.getItem('gt_user');
const GT_ROLE  = sessionStorage.getItem('gt_role');
const GT_LOJA  = sessionStorage.getItem('gt_loja');

if (!GT_USER) window.location.href = 'login.html';

// Aplica tema salvo
if ((localStorage.getItem('gt_theme') || 'light') === 'dark') document.body.classList.add('dark');

document.getElementById('userLabel').textContent = GT_ROLE === 'admin' ? 'Administrador' : GT_LOJA;

// =============================================
// MODO VENDEDOR — trava a saída do Follow-Up
// =============================================
const MODO_VENDEDOR_KEY = 'gt_modo_vendedor';

function checarModoVendedor() {
  const ativo = sessionStorage.getItem(MODO_VENDEDOR_KEY) === 'sim';
  const btnModo = document.getElementById('btnModoVendedor');
  // No modo vendedor, esconde o próprio botão de ativar (já está ativo)
  if (btnModo) btnModo.style.display = ativo ? 'none' : 'inline-flex';
  return ativo;
}

function ativarModoVendedor() {
  if (!confirm('Ativar Modo Vendedor?\n\nO acesso ao Dashboard ficará bloqueado até digitar a senha da loja. Use isso ao deixar um vendedor usando o Follow-Up.')) return;
  sessionStorage.setItem(MODO_VENDEDOR_KEY, 'sim');
  checarModoVendedor();
  mostrarToast('🔒 Modo Vendedor ativado. Dashboard bloqueado.', true);
}

function voltarDashboard() {
  // Se modo vendedor ativo, exige senha da loja
  if (checarModoVendedor()) {
    abrirModalSenhaDashboard();
  } else {
    window.location.href = 'index.html';
  }
}

function abrirModalSenhaDashboard() {
  const overlay = document.createElement('div');
  overlay.id = 'modalSenhaDash';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(0,0,0,.3)">
      <div style="text-align:center;margin-bottom:20px">
        <div style="width:48px;height:48px;border-radius:12px;background:var(--primary-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <div style="font-size:16px;font-weight:700;color:var(--text)">Acesso ao Dashboard</div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px">Digite a senha da loja para continuar</div>
      </div>
      <input type="password" id="senhaDashInput" placeholder="Senha da loja" onkeydown="if(event.key==='Enter')confirmarSenhaDashboard()"
        style="width:100%;height:44px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;padding:0 14px;outline:none;margin-bottom:12px;text-align:center"/>
      <div id="senhaDashErro" style="background:var(--red-dim);border-radius:8px;padding:8px 12px;color:var(--red);font-size:12px;margin-bottom:12px;display:none;text-align:center"></div>
      <button onclick="confirmarSenhaDashboard()" id="btnConfirmarSenha" style="width:100%;height:44px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px">Desbloquear</button>
      <button onclick="document.getElementById('modalSenhaDash').remove()" style="width:100%;height:40px;background:transparent;color:var(--text3);border:1px solid var(--border);border-radius:10px;font-size:13px;cursor:pointer">Cancelar</button>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('senhaDashInput')?.focus(), 100);
}

async function confirmarSenhaDashboard() {
  const senha = document.getElementById('senhaDashInput').value.trim();
  const erroEl = document.getElementById('senhaDashErro');
  const btn = document.getElementById('btnConfirmarSenha');
  erroEl.style.display = 'none';

  if (!senha) { erroEl.textContent = 'Digite a senha.'; erroEl.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'Verificando...';

  try {
    // Valida a senha da loja no backend (mesmo login)
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ acao: 'login', usuario: GT_USER, senha })
    });
    const data = await res.json();

    if (data.ok) {
      // Senha correta — desativa modo vendedor e libera
      sessionStorage.removeItem(MODO_VENDEDOR_KEY);
      window.location.href = 'index.html';
    } else {
      erroEl.textContent = 'Senha incorreta.';
      erroEl.style.display = 'block';
      document.getElementById('senhaDashInput').value = '';
      btn.disabled = false;
      btn.textContent = 'Desbloquear';
    }
  } catch(e) {
    erroEl.textContent = 'Erro de conexão.';
    erroEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Desbloquear';
  }
}

function mostrarToast(msg, success) {
  const old = document.getElementById('fuToast');
  if (old) old.remove();
  const toast = document.createElement('div');
  toast.id = 'fuToast';
  toast.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${success?'var(--primary)':'var(--red)'};color:#fff;border-radius:10px;padding:12px 20px;font-size:13px;z-index:9999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3)`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 3000);
}

checarModoVendedor();
if (GT_ROLE === 'loja') {
  const wrap = document.getElementById('fLojaWrap');
  if (wrap) wrap.style.display = 'none';
}

const pad = n => String(n).padStart(2,'0');
const toInput = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = new Date();
const d7 = new Date(); d7.setDate(d7.getDate() - 7);
document.getElementById('fDI').value = toInput(d7);
document.getElementById('fDF').value = toInput(hoje);

let TODOS = [];
let MOTIVO_SEL = '';

async function init() {
  try {
    const res = await fetch(API_URL + '?acao=dados');
    const data = await res.json();
    if (data.erro) throw new Error(data.erro);
    TODOS = (data.registros || []).filter(r =>
      r.comprou === 'NÃO' && r.detalhe && r.detalhe.trim() !== ''
    );
    aplicarFiltros();
  } catch(e) {
    document.getElementById('cardsWrap').innerHTML =
      `<div class="empty"><p>Erro ao carregar dados.<br><small>${e.message}</small></p></div>`;
  }
}

function filtrarBase() {
  const dI    = document.getElementById('fDI').value;
  const dF    = document.getElementById('fDF').value;
  const loja  = GT_ROLE === 'loja' ? GT_LOJA : document.getElementById('fLoja').value;

  let lista = TODOS;
  if (dI) {
    const [yi,mi,di] = dI.split('-').map(Number);
    const inicio = new Date(yi, mi-1, di);
    lista = lista.filter(r => {
      if (!r.data) return false;
      const [dd,mm,yy] = r.data.split('/').map(Number);
      return new Date(yy,mm-1,dd) >= inicio;
    });
  }
  if (dF) {
    const [yf,mf,df] = dF.split('-').map(Number);
    const fim = new Date(yf, mf-1, df);
    lista = lista.filter(r => {
      if (!r.data) return false;
      const [dd,mm,yy] = r.data.split('/').map(Number);
      return new Date(yy,mm-1,dd) <= fim;
    });
  }
  if (loja) lista = lista.filter(r => r.loja === loja);
  return lista;
}

function aplicarFiltros() {
  const base = filtrarBase();

  // Atualiza contadores dos balões
  const cont = { '':base.length, 'OUTROS':0, 'PREÇO':0, 'NÃO TEM':0, 'NÚMERO':0 };
  base.forEach(r => { if (cont[r.motivo] !== undefined) cont[r.motivo]++; });
  document.getElementById('cnt-todos').textContent  = cont[''];
  document.getElementById('cnt-outros').textContent = cont['OUTROS'];
  document.getElementById('cnt-preco').textContent  = cont['PREÇO'];
  document.getElementById('cnt-naotem').textContent = cont['NÃO TEM'];
  document.getElementById('cnt-numero').textContent = cont['NÚMERO'];

  // Filtra por motivo selecionado
  let lista = MOTIVO_SEL ? base.filter(r => r.motivo === MOTIVO_SEL) : base;
  renderCards(lista);
}

function selecionarMotivo(el, motivo) {
  MOTIVO_SEL = motivo;
  document.querySelectorAll('.ball').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  aplicarFiltros();
}

let LISTA_ATUAL = [];
function renderCards(lista) {
  LISTA_ATUAL = lista;
  const wrap = document.getElementById('cardsWrap');
  wrap.className = '';
  if (!lista.length) {
    wrap.innerHTML = `<div class="cards-grid"><div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      <p>Nenhum registro encontrado<br><small>Ajuste os filtros ou o período</small></p>
    </div></div>`;
    return;
  }
  wrap.innerHTML = '<div class="cards-grid">' + lista.map((r,i) => cardHTML(r,i)).join('') + '</div>';
}

function motivoClass(m) {
  if (m === 'OUTROS') return 'mt-outros';
  if (m === 'PREÇO') return 'mt-preco';
  if (m === 'NÃO TEM') return 'mt-naotem';
  if (m === 'NÚMERO') return 'mt-numero';
  return 'mt-outros';
}

function cardHTML(r, idx) {
  const pill = r.marca === 'Santa Lolla'
    ? '<span class="pill pill-sl">Santa Lolla</span>'
    : '<span class="pill pill-hv">Havaianas</span>';
  const motivoTag = r.motivo ? `<span class="motivo-tag ${motivoClass(r.motivo)}">${r.motivo}</span>` : '';
  const temTel = r.telefone && r.telefone.trim() !== '';

  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="card-nome">${r.cliente || 'Cliente'}</div>
        <div class="card-meta">${r.data || ''} · ${r.vendedor || ''}<br>${r.loja || ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end">
        ${pill}${motivoTag}
      </div>
    </div>
    <div class="card-detalhe">"${r.detalhe}"</div>
    <div class="card-ia" id="ia-${idx}">
      <div class="ia-label"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 14.93V17a1 1 0 00-2 0v-.07A8 8 0 014 12a8 8 0 0116 0 8 8 0 01-7 7.93zM11 9V7a1 1 0 012 0v2a1 1 0 01-2 0z"/></svg>Sugestão IA</div>
      <div id="ia-txt-${idx}"></div>
    </div>
    <div class="card-footer">
      <button class="btn-ia" id="btn-ia-${idx}" onclick="gerarIA(${idx})">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Gerar sugestão IA
      </button>
      <a class="btn-wpp ${temTel?'':'disabled'}" id="btn-wpp-${idx}" ${temTel?'':'title="Sem telefone"'}
         href="${temTel ? wppLink(r.telefone,'') : '#'}" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        ${temTel ? 'WhatsApp' : 'Sem telefone'}
      </a>
    </div>
  </div>`;
}

function wppLink(tel, msg) {
  const num = tel.replace(/\D/g,'');
  const full = num.startsWith('55') ? num : '55' + num;
  return `https://wa.me/${full}?text=${encodeURIComponent(msg)}`;
}

async function gerarIA(idx) {
  const r = LISTA_ATUAL[idx];
  if (!r) return;
  const btn = document.getElementById(`btn-ia-${idx}`);
  const iaDiv = document.getElementById(`ia-${idx}`);
  const iaTxt = document.getElementById(`ia-txt-${idx}`);
  const wppBtn = document.getElementById(`btn-wpp-${idx}`);

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner-sm"></div> Gerando...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        acao:'gerarMensagemIA', loja:r.loja, marca:r.marca,
        cliente:r.cliente, motivo:r.motivo, detalhe:r.detalhe
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.erro || 'Erro ao gerar mensagem.');

    const msg = data.mensagem;
    iaTxt.textContent = msg;
    iaDiv.classList.add('show');
    if (r.telefone && r.telefone.trim()) {
      wppBtn.href = wppLink(r.telefone, msg);
      wppBtn.classList.remove('disabled');
    }
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg> Regerar`;
    btn.disabled = false;
  } catch(e) {
    iaTxt.textContent = 'Erro ao gerar: ' + e.message;
    iaDiv.classList.add('show');
    btn.innerHTML = 'Tentar novamente';
    btn.disabled = false;
  }
}

init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
